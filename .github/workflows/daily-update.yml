name: Daglig oppdatering av internships

on:
  schedule:
    # 05:00 UTC ~ 06:00-07:00 norsk tid (avhengig av sommer-/vintertid)
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install anthropic

      - name: Kjør research og oppdater data.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/update_internships.py

      - name: Commit og push hvis noe endret seg
        run: |
          git config user.name "internshipradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i data.json i dag."
          else
            git commit -m "Daglig oppdatering av internships"
            git push
          fi
