name: Daglig oppdatering av internships

on:
  schedule:
    # Kjøres hver dag kl. 05:00 UTC ~ 06:00-07:00 norsk tid, men selve
    # research-steget (som koster Anthropic API-kreditter) kjører kun på
    # mandager - se "Sjekk om det er mandag" og betingelsen på research-steget
    # under. Fristvarsel-e-postene (som er gratis) fortsetter å sjekkes hver
    # dag, slik at ingen mister et fristvarsel bare fordi det ikke er mandag.
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4

      - name: Sjekk om det er mandag
        id: dagsjekk
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "er_mandag=true" >> "$GITHUB_OUTPUT"
          else
            echo "er_mandag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install anthropic firebase-admin

      - name: Kjør research og oppdater data.json (kun mandager, eller manuell kjøring)
        if: steps.dagsjekk.outputs.er_mandag == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/update_internships.py

      - name: Commit og push hvis noe endret seg
        run: |
          git config user.name "internshipradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i data.json i dag."
          else
            git commit -m "Daglig oppdatering av internships"
            git push
          fi

      - name: Send e-postvarsler om nærstående søknadsfrister
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python .github/scripts/send_deadline_emails.py

      - name: Send e-postvarsler om nye internships
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python .github/scripts/send_new_internships_emails.py
